<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>山ちゃんが飛ぶ!!</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0d12;
    color: #e6e8ee;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 14px;
  }
  h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: 0.03em; }
  .subtitle { font-size: 12px; color: #8a8f9a; margin: 0; }
  .help { font-size: 13px; color: #9aa0ab; margin: 0; text-align: center; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    border: 1px solid #3a3f4b;
    touch-action: none;
    user-select: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0,0,0,0.72);
    border-radius: 10px;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0 0 6px; font-size: 26px; }
  .overlay .sub { font-size: 12px; color: #9aa0ab; margin: 0 0 10px; }
  .overlay p.desc { font-size: 13px; color: #cfd3da; margin: 0 0 22px; max-width: 520px; }
  .btn {
    padding: 10px 28px;
    border-radius: 9999px;
    border: none;
    background: #f5c542;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-secondary {
    padding: 8px 22px;
    border-radius: 9999px;
    background: transparent;
    border: 1px solid #888;
    color: #eee;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  .ency-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
    text-align: left;
    width: 100%;
    max-width: 640px;
    padding: 0 4px;
  }
  @media (min-width: 560px) {
    .ency-grid { grid-template-columns: 1fr 1fr; }
  }
  .ency-card {
    border: 1px solid #555;
    border-radius: 8px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.3);
  }
  .ency-card .name { font-weight: 700; }
  .ency-card .role { font-size: 11px; color: #9aa0ab; margin-left: 6px; font-weight: 400; }
  .ency-card ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: #cfd3da; }
  .note {
    font-size: 11px;
    color: #666c78;
    max-width: 640px;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <h1>山ちゃんが飛ぶ!!</h1>
  <p class="subtitle">舞台：荏田高等学校</p>
  <p class="help">押しっぱなし / タップ長押し / Space・↑キーで上昇。離すと落下します。</p>

  <div class="stage" id="stage">
    <canvas id="game" width="800" height="450"></canvas>

    <div class="overlay show" id="overlay-title">
      <h2>山ちゃんが飛ぶ!!</h2>
      <p class="sub">舞台：荏田高等学校</p>
      <p class="desc">放課後の荏田高校の空を、ラスボス「フック」を目指してひたすら飛べ！</p>
      <button class="btn" id="btn-start">スタート</button>
      <button class="btn-secondary" id="btn-ency-1">キャラクター図鑑</button>
    </div>

    <div class="overlay" id="overlay-ency">
      <h2 style="font-size:20px;">キャラクター図鑑</h2>
      <div class="ency-grid" id="ency-list"></div>
      <button class="btn-secondary" id="btn-back">もどる</button>
    </div>

    <div class="overlay" id="overlay-gameover">
      <h2 style="color:#ff8080;">GAME OVER</h2>
      <p class="desc" id="gameover-distance"></p>
      <button class="btn" id="btn-retry-1">もう一度飛ぶ</button>
      <button class="btn-secondary" id="btn-title-1">タイトルへ</button>
    </div>

    <div class="overlay" id="overlay-win">
      <h2 style="color:#ffe066;">フック撃破！</h2>
      <p class="desc">山ちゃん「…俺の勝ちだな。」<br>フック「…次の服、探しに行くか。」</p>
      <button class="btn" id="btn-retry-2">もう一度飛ぶ</button>
      <button class="btn-secondary" id="btn-ency-2">キャラクター図鑑</button>
    </div>
  </div>

  <p class="note">ブラウザだけで動くスタンドアロン版です。このHTMLファイル単体を友達に送れば、ダブルクリックで遊べます。</p>

<script>
(function () {
  "use strict";

  var W = 800, H = 450;
  var GROUND_Y = H - 40, CEIL_Y = 20;
  var GRAVITY = 1500, THRUST = -2700, MAX_VY = 820;
  var BOSS_DISTANCE = 2600, BOSS_HP_MAX = 5;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");

  var overlays = {
    title: document.getElementById("overlay-title"),
    ency: document.getElementById("overlay-ency"),
    gameover: document.getElementById("overlay-gameover"),
    win: document.getElementById("overlay-win"),
  };
  function showOverlay(name) {
    Object.keys(overlays).forEach(function (k) {
      overlays[k].classList.toggle("show", k === name);
    });
  }
  function hideAllOverlays() {
    Object.keys(overlays).forEach(function (k) { overlays[k].classList.remove("show"); });
  }

  var BIOS = [
    { name: "山ちゃん", role: "主人公", color: "#f5f0dc",
      bullets: ["白いタキシードがトレードマーク", "とにかくよく飛ぶ", "笑顔だけは一級品"] },
    { name: "フック", role: "ラストボス", color: "#9aa0ab",
      bullets: ["性格は怖い", "服が好き", "ギターボーカル", "ストレイテナーが好き"] },
    { name: "エビちゃん", role: "山ちゃんの元カノ", color: "#e8c34a",
      bullets: ["ドラマー", "がりがり", "足が細い", "バットで殴ったら死ぬ"] },
    { name: "たけひこ", role: "バレーボール男子", color: "#6fa8dc",
      bullets: ["元カノは平井", "ミットン", "芦田愛菜に似てる", "ギタリスト", "GANTZが好き"] },
    { name: "ハシダテ", role: "ギターボーカル", color: "#c98a4b",
      bullets: ["ハンターハンターのグリードアイランド編をドッチ団平と勘違いしている", "急にデブになったり痩せたりする"] },
    { name: "吉野", role: "ドラマー", color: "#8a8f98",
      bullets: ["鳥に似てる", "手首が固い", "ブサイク", "みんなに頭を殴られる", "メガネを壊されると「眼鏡はねえだろ!」ってキレる"] },
    { name: "布施", role: "デポジット侍", color: "#7fb37f",
      bullets: ["南町田でキセルする", "ドラマー", "汐見という美容師に髪を切ってもらっている", "弁当箱を回収して回っている"] },
  ];
  (function buildEncyclopedia() {
    var list = document.getElementById("ency-list");
    BIOS.forEach(function (b) {
      var card = document.createElement("div");
      card.className = "ency-card";
      var ul = b.bullets.map(function (line) { return "<li>" + line + "</li>"; }).join("");
      card.innerHTML =
        '<div class="name" style="color:' + b.color + '">' + b.name +
        '<span class="role">' + b.role + "</span></div>" +
        "<ul>" + ul + "</ul>";
      list.appendChild(card);
    });
  })();

  function rand(min, max) { return Math.random() * (max - min) + min; }

  var mode = "title"; // title | ency | playing | boss | gameover | win

  var state = {
    player: { x: 150, y: H / 2, vy: 0, r: 20, lives: 3, invincible: 0, ammo: 0 },
    obstacles: [], projectiles: [], items: [], particles: [],
    distance: 0, scrollSpeed: 230, spawnTimer: 0, itemTimer: 0,
    holding: false, message: "", messageTimer: 0,
    boss: { x: W - 150, y: H / 2, hp: BOSS_HP_MAX, attackTimer: 1.2, pattern: 0, flinch: 0, enraged: false },
    lastTime: 0,
  };

  function resetGame() {
    state.player = { x: 150, y: H / 2, vy: 0, r: 20, lives: 3, invincible: 1.2, ammo: 0 };
    state.obstacles = []; state.projectiles = []; state.items = []; state.particles = [];
    state.distance = 0; state.scrollSpeed = 230; state.spawnTimer = 1; state.itemTimer = 1.5;
    state.message = ""; state.messageTimer = 0;
    state.boss = { x: W - 150, y: H / 2, hp: BOSS_HP_MAX, attackTimer: 1.6, pattern: 0, flinch: 0, enraged: false };
  }

  function showMessage(msg, dur) {
    state.message = msg;
    state.messageTimer = dur || 1.6;
  }

  function addParticles(x, y, color, count) {
    count = count || 10;
    for (var i = 0; i < count; i++) {
      state.particles.push({ x: x, y: y, vx: rand(-160, 160), vy: rand(-220, -40), life: 0.6, maxLife: 0.6, color: color });
    }
  }

  function loseLife(msg) {
    if (state.player.invincible > 0) return;
    state.player.lives -= 1;
    state.player.invincible = 1.4;
    addParticles(state.player.x, state.player.y, "#ff5c5c", 14);
    showMessage(msg);
    if (state.player.lives <= 0) {
      mode = "gameover";
      document.getElementById("gameover-distance").textContent = "飛距離: " + Math.floor(state.distance) + "m";
      showOverlay("gameover");
    }
  }

  function instantDeath(msg) {
    if (state.player.invincible > 0) return;
    state.player.lives = 0;
    addParticles(state.player.x, state.player.y, "#ffd25c", 24);
    showMessage(msg, 2.2);
    mode = "gameover";
    document.getElementById("gameover-distance").textContent = "飛距離: " + Math.floor(state.distance) + "m";
    showOverlay("gameover");
  }

  // ---------- 入力 ----------
  canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); state.holding = true; });
  window.addEventListener("pointerup", function () { state.holding = false; });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") state.holding = true;
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp") state.holding = false;
  });

  document.getElementById("btn-start").addEventListener("click", function () {
    resetGame(); mode = "playing"; hideAllOverlays();
  });
  document.getElementById("btn-retry-1").addEventListener("click", function () {
    resetGame(); mode = "playing"; hideAllOverlays();
  });
  document.getElementById("btn-retry-2").addEventListener("click", function () {
    resetGame(); mode = "playing"; hideAllOverlays();
  });
  document.getElementById("btn-title-1").addEventListener("click", function () {
    mode = "title"; showOverlay("title");
  });
  document.getElementById("btn-ency-1").addEventListener("click", function () {
    mode = "ency"; showOverlay("ency");
  });
  document.getElementById("btn-ency-2").addEventListener("click", function () {
    mode = "ency"; showOverlay("ency");
  });
  document.getElementById("btn-back").addEventListener("click", function () {
    mode = "title"; showOverlay("title");
  });

  // ---------- スポーン ----------
  function spawnObstacle() {
    var types = ["takehiko", "ebi", "hashidate", "yoshino", "fuse"];
    var weights = [3, 2, 3, 3, 1.4];
    var total = weights.reduce(function (a, b) { return a + b; }, 0);
    var r = Math.random() * total;
    var type = "takehiko";
    for (var i = 0; i < types.length; i++) {
      if (r < weights[i]) { type = types[i]; break; }
      r -= weights[i];
    }
    var y = rand(CEIL_Y + 60, GROUND_Y - 60);
    state.obstacles.push({ type: type, x: W + 40, y: y, vx: -state.scrollSpeed, phase: Math.random() * Math.PI * 2, cooldown: rand(0.6, 1.2), hit: false });
  }

  function spawnItem() {
    var kind = Math.random() < 0.55 ? "clothes" : (Math.random() < 0.8 ? "cd" : "bento");
    var y = rand(CEIL_Y + 40, GROUND_Y - 40);
    state.items.push({ kind: kind, x: W + 40, y: y, r: 12 });
  }

  // ---------- 更新 ----------
  function updatePlayer(dt) {
    var p = state.player;
    p.vy += (state.holding ? THRUST : GRAVITY) * dt;
    if (p.vy > MAX_VY) p.vy = MAX_VY;
    if (p.vy < -MAX_VY) p.vy = -MAX_VY;
    p.y += p.vy * dt;
    if (p.y < CEIL_Y) { p.y = CEIL_Y; p.vy = 0; }
    if (p.y > GROUND_Y) { p.y = GROUND_Y; loseLife("地面に激突！"); }
    if (p.invincible > 0) p.invincible -= dt;
  }

  function updateParticles(dt) {
    for (var i = 0; i < state.particles.length; i++) {
      var pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 500 * dt; pt.life -= dt;
    }
    state.particles = state.particles.filter(function (p) { return p.life > 0; });
  }

  function updatePlaying(dt) {
    updatePlayer(dt);
    state.distance += state.scrollSpeed * dt * 0.06;
    state.scrollSpeed = Math.min(230 + state.distance * 0.18, 520);

    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnObstacle();
      state.spawnTimer = Math.max(1.5 - state.distance / 4000, 0.7) + Math.random() * 0.6;
    }
    state.itemTimer -= dt;
    if (state.itemTimer <= 0) { spawnItem(); state.itemTimer = rand(1.1, 2.0); }

    state.obstacles.forEach(function (ob) {
      ob.x += ob.vx * dt; ob.phase += dt;
      if (ob.type === "takehiko") {
        ob.cooldown -= dt;
        if (ob.cooldown <= 0 && ob.x < W - 60 && ob.x > 80) {
          state.projectiles.push({ kind: "volleyball", x: ob.x, y: ob.y, vx: -420, vy: 0, r: 10 });
          ob.cooldown = 999;
        }
      }
      if (ob.type === "yoshino") { ob.y += Math.sin(ob.phase * 3) * 60 * dt; }

      var hbW = ob.type === "hashidate" ? 34 + Math.sin(ob.phase * 1.6) * 22 : 26;
      var dx = state.player.x - ob.x, dy = state.player.y - ob.y;
      var dist = Math.hypot(dx, dy);
      if (!ob.hit && dist < hbW + state.player.r * 0.7) {
        ob.hit = true;
        if (ob.type === "ebi") {
          instantDeath("エビちゃんに接触…華奢すぎる衝撃で撃沈！");
        } else if (ob.type === "fuse") {
          state.player.ammo = Math.min(state.player.ammo + 1, 5);
          state.distance += 40;
          addParticles(ob.x, ob.y, "#7fb37f", 12);
          showMessage("デポジット侍・布施「弁当箱、回収！」南町田キセル成功で得点ボーナス！");
        } else if (ob.type === "hashidate" && Math.sin(ob.phase * 1.6) < -0.4) {
          addParticles(ob.x, ob.y, "#c98a4b", 8);
          showMessage("ハシダテが急に痩せた！スルー成功…ドッチ団平の話はまだ続いている");
        } else if (ob.type === "yoshino") {
          addParticles(ob.x, ob.y - 10, "#8a8f98", 10);
          showMessage("吉野「眼鏡はねえだろ！」メガネが粉砕！");
          loseLife("吉野にゲンコツを食らった！");
        } else {
          loseLife(ob.type === "takehiko" ? "たけひこに衝突！" : "ハシダテ（デブ状態）にぶつかった！");
        }
      }
    });
    state.obstacles = state.obstacles.filter(function (o) { return o.x > -80; });

    state.projectiles.forEach(function (pr) { pr.x += pr.vx * dt; pr.y += pr.vy * dt; });
    state.projectiles = state.projectiles.filter(function (pr) {
      if (pr.x < -40) return false;
      var dx = state.player.x - pr.x, dy = state.player.y - pr.y;
      if (Math.hypot(dx, dy) < pr.r + state.player.r * 0.7) {
        loseLife("バレーボール直撃！");
        addParticles(pr.x, pr.y, "#ff8c3c", 8);
        return false;
      }
      return true;
    });

    state.items.forEach(function (it) { it.x -= state.scrollSpeed * dt; });
    state.items = state.items.filter(function (it) {
      if (it.x < -30) return false;
      var dx = state.player.x - it.x, dy = state.player.y - it.y;
      if (Math.hypot(dx, dy) < it.r + state.player.r * 0.7) {
        addParticles(it.x, it.y, it.kind === "clothes" ? "#f5f0dc" : it.kind === "cd" ? "#b0e0ff" : "#e0c060", 8);
        if (it.kind === "cd") {
          state.player.ammo = Math.min(state.player.ammo + 1, 5);
          showMessage("ストレイテナーのCDをゲット！(フックの私物…？)");
        } else if (it.kind === "clothes") {
          state.distance += 20;
          showMessage("お洒落な服をゲット！距離ボーナス！");
        } else {
          state.distance += 15;
        }
        return false;
      }
      return true;
    });

    updateParticles(dt);
    if (state.messageTimer > 0) state.messageTimer -= dt;

    if (state.distance >= BOSS_DISTANCE) {
      mode = "boss";
      showMessage("フック「…そこまでだ。」", 2);
    }
  }

  function updateBoss(dt) {
    updatePlayer(dt);
    if (state.player.x < W / 2 - 260) state.player.x += 200 * dt;
    state.player.x = Math.min(state.player.x, W / 2 - 260);

    var b = state.boss;
    b.enraged = b.hp <= BOSS_HP_MAX / 2;
    b.y = H / 2 + Math.sin(Date.now() / 900) * 60;
    if (b.flinch > 0) b.flinch -= dt;

    b.attackTimer -= dt;
    var interval = b.enraged ? 1.0 : 1.6;
    if (b.attackTimer <= 0 && b.flinch <= 0) {
      b.pattern = (b.pattern + 1) % 3;
      if (b.pattern === 0) {
        for (var i = -2; i <= 2; i++) {
          state.projectiles.push({ kind: "note", x: b.x, y: b.y + i * 34, vx: -360, vy: 0, r: 9 });
        }
      } else if (b.pattern === 1) {
        var dx0 = state.player.x - b.x, dy0 = state.player.y - b.y;
        var len = Math.hypot(dx0, dy0) || 1;
        state.projectiles.push({ kind: "note", x: b.x, y: b.y, vx: (dx0 / len) * 380, vy: (dy0 / len) * 380, r: 11 });
      } else {
        for (var j = 0; j < 4; j++) {
          state.projectiles.push({ kind: "note", x: b.x, y: 60 + j * 100, vx: -340, vy: Math.sin(j) * 80, r: 9 });
        }
      }
      b.attackTimer = interval;
    }

    if (state.player.ammo > 0) {
      state.player.ammo -= 1;
      state.projectiles.push({ kind: "cd", x: state.player.x, y: state.player.y, vx: 460, vy: 0, r: 10, toBoss: true });
    }

    state.projectiles.forEach(function (pr) { pr.x += pr.vx * dt; pr.y += pr.vy * dt; });
    state.projectiles = state.projectiles.filter(function (pr) {
      if (pr.toBoss) {
        if (pr.x > W + 40) return false;
        var dx = b.x - pr.x, dy = b.y - pr.y;
        if (Math.hypot(dx, dy) < 30 && b.flinch <= 0) {
          b.hp -= 1; b.flinch = 0.8;
          addParticles(b.x, b.y, "#ffd25c", 16);
          showMessage("フック「俺の服とCDに何しやがる…！」", 1.4);
          if (b.hp <= 0) { mode = "win"; showOverlay("win"); }
          return false;
        }
        return pr.x < W + 40;
      }
      if (pr.x < -40) return false;
      var dx2 = state.player.x - pr.x, dy2 = state.player.y - pr.y;
      if (Math.hypot(dx2, dy2) < pr.r + state.player.r * 0.7) {
        loseLife("フックのギターノートを食らった！");
        addParticles(pr.x, pr.y, "#c9a6ff", 10);
        return false;
      }
      return true;
    });

    updateParticles(dt);
    if (state.messageTimer > 0) state.messageTimer -= dt;
  }

  // ---------- 描画 ----------
  function drawBackground() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#1a2140"); grad.addColorStop(1, "#3c5a80");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = "rgba(255,255,255,0.5)";
    var t = Date.now() / 4000;
    for (var i = 0; i < 6; i++) {
      var cx = ((i * 180 + t * 60) % (W + 200)) - 100;
      var cy = 60 + (i % 3) * 50;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 34, 14, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 24, cy + 4, 24, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    var buildT = (Date.now() / 1000 * 20) % (W + 400);
    ctx.save();
    ctx.globalAlpha = 0.85;
    for (var k = -1; k < 2; k++) {
      var bx = ((W + 400) - buildT + k * (W + 400)) % (W + 800) - 400;
      ctx.fillStyle = "#2c3446";
      ctx.fillRect(bx, GROUND_Y - 90, 220, 104);
      ctx.fillStyle = "#7fd1e0";
      for (var r = 0; r < 3; r++) {
        for (var c = 0; c < 6; c++) {
          ctx.fillRect(bx + 10 + c * 34, GROUND_Y - 78 + r * 28, 22, 16);
        }
      }
      ctx.fillStyle = "#e8e2c8";
      ctx.fillRect(bx + 60, GROUND_Y - 116, 100, 22);
      ctx.strokeStyle = "#8a8360";
      ctx.strokeRect(bx + 60, GROUND_Y - 116, 100, 22);
      ctx.fillStyle = "#2c3446";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("荏田高等学校", bx + 110, GROUND_Y - 100);
    }
    ctx.restore();

    ctx.fillStyle = "#25361f";
    ctx.fillRect(0, GROUND_Y + 14, W, H - GROUND_Y - 14);
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 14); ctx.lineTo(W, GROUND_Y + 14); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.beginPath(); ctx.moveTo(0, CEIL_Y - 4); ctx.lineTo(W, CEIL_Y - 4); ctx.stroke();
  }

  function label(text, x, y) {
    ctx.font = "12px sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillText(text, x + 1, y + 1);
    ctx.fillStyle = "#fff"; ctx.fillText(text, x, y);
  }

  function drawYamachan(x, y, flash) {
    ctx.save(); ctx.translate(x, y);
    var tilt = Math.max(-0.4, Math.min(0.4, state.player.vy / 1400));
    ctx.rotate(tilt);
    if (flash && Math.floor(Date.now() / 90) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.fillStyle = "#f5f0dc";
    ctx.beginPath(); ctx.ellipse(0, 10, 16, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d8cfa0"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#f2c49b";
    ctx.beginPath(); ctx.arc(0, -12, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1c1c1c";
    ctx.beginPath(); ctx.arc(0, -18, 13, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#7a4a2a"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -8, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(-4, -14, 1.4, 0, Math.PI * 2); ctx.arc(4, -14, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(ob) {
    ctx.save(); ctx.translate(ob.x, ob.y);
    if (ob.type === "takehiko") {
      ctx.fillStyle = "#6fa8dc";
      ctx.beginPath(); ctx.ellipse(0, 6, 15, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f2c49b";
      ctx.beginPath(); ctx.arc(0, -14, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath(); ctx.arc(0, -19, 12, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffcf5c";
      ctx.beginPath(); ctx.arc(22, -6, 8, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
      label("たけひこ", 0, -36);
    } else if (ob.type === "ebi") {
      ctx.fillStyle = "#e8c34a"; ctx.strokeStyle = "#c9a020"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 22); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8, 6); ctx.lineTo(8, 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(-7, 34); ctx.moveTo(0, 22); ctx.lineTo(7, 34); ctx.stroke();
      ctx.fillStyle = "#f2c49b";
      ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e8c34a";
      ctx.beginPath(); ctx.arc(0, -19, 10, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillRect(-14, -24, 5, 14); ctx.fillRect(9, -24, 5, 14);
      label("エビちゃん", 0, -40);
    } else if (ob.type === "hashidate") {
      var scale = 1 + Math.sin(ob.phase * 1.6) * 0.55;
      ctx.scale(scale, scale);
      ctx.fillStyle = "#c98a4b";
      ctx.beginPath(); ctx.ellipse(0, 8, 18, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f2c49b";
      ctx.beginPath(); ctx.arc(0, -16, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-20, 4); ctx.lineTo(20, -2); ctx.stroke();
      ctx.restore(); ctx.save(); ctx.translate(ob.x, ob.y);
      label("ハシダテ", 0, -40 - Math.max(0, Math.sin(ob.phase * 1.6) * 20));
    } else if (ob.type === "yoshino") {
      ctx.fillStyle = "#8a8f98";
      ctx.beginPath(); ctx.ellipse(0, 6, 13, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#cfd3d8";
      ctx.beginPath(); ctx.arc(0, -12, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#e0a030";
      ctx.beginPath(); ctx.moveTo(9, -12); ctx.lineTo(22, -9); ctx.lineTo(9, -6); ctx.fill();
      ctx.strokeStyle = "#222"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(-4, -12, 4, 0, Math.PI * 2); ctx.arc(4, -12, 4, 0, Math.PI * 2); ctx.stroke();
      label("吉野", 0, -34);
    } else if (ob.type === "fuse") {
      ctx.fillStyle = "#7fb37f";
      ctx.beginPath(); ctx.ellipse(0, 6, 14, 17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f2c49b";
      ctx.beginPath(); ctx.arc(0, -14, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#5a3a1a";
      ctx.beginPath(); ctx.arc(0, -19, 11, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#d6d6d6"; ctx.fillRect(14, 0, 14, 10);
      ctx.strokeStyle = "#999"; ctx.strokeRect(14, 0, 14, 10);
      label("布施(デポジット侍)", 0, -36);
    }
    ctx.restore();
  }

  function drawProjectile(pr) {
    ctx.save(); ctx.translate(pr.x, pr.y);
    if (pr.kind === "volleyball") {
      ctx.fillStyle = "#f2f2f2";
      ctx.beginPath(); ctx.arc(0, 0, pr.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#c66"; ctx.stroke();
    } else if (pr.kind === "note") {
      ctx.fillStyle = "#c9a6ff"; ctx.font = "18px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("♪", 0, 6);
    } else {
      ctx.fillStyle = "#dfefff";
      ctx.beginPath(); ctx.arc(0, 0, pr.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#8fb8d6";
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawItem(it) {
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(it.kind === "clothes" ? "👔" : it.kind === "cd" ? "💿" : "🍱", 0, 0);
    ctx.restore();
  }

  function drawHook(enraged, flinch) {
    var b = state.boss;
    ctx.save(); ctx.translate(b.x, b.y);
    if (flinch > 0) ctx.translate(rand(-4, 4), rand(-4, 4));
    ctx.fillStyle = enraged ? "#3a2030" : "#20232e";
    ctx.beginPath(); ctx.ellipse(0, 14, 26, 34, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#888"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-6, 30); ctx.moveTo(0, -4); ctx.lineTo(6, 30); ctx.stroke();
    ctx.fillStyle = "#f2c49b";
    ctx.beginPath(); ctx.arc(0, -22, 18, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#241c14";
    ctx.beginPath(); ctx.arc(0, -28, 18, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-7, -22, 6, 0, Math.PI * 2); ctx.arc(7, -22, 6, 0, Math.PI * 2);
    ctx.moveTo(-1, -22); ctx.lineTo(1, -22); ctx.stroke();
    ctx.fillStyle = "#111"; ctx.fillRect(-9, -24, 4, 3); ctx.fillRect(5, -24, 4, 3);
    ctx.save(); ctx.translate(-30, 10); ctx.rotate(-0.5);
    ctx.fillStyle = "#8a4a2a";
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-2, -34, 4, 22);
    ctx.restore(); ctx.restore();
    label("フック", b.x, b.y - 58);
  }

  function drawParticles() {
    state.particles.forEach(function (pt) {
      ctx.globalAlpha = Math.max(pt.life / pt.maxLife, 0);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("♥".repeat(Math.max(state.player.lives, 0)) + "♡".repeat(Math.max(3 - state.player.lives, 0)), 14, 26);
    ctx.fillText("飛距離: " + Math.floor(state.distance) + "m", 14, 46);
    ctx.fillText("CD: " + state.player.ammo, 14, 66);

    if (mode === "playing") {
      var pct = Math.min(state.distance / BOSS_DISTANCE, 1);
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(W - 220, 16, 200, 12);
      ctx.fillStyle = "#ffd25c"; ctx.fillRect(W - 220, 16, 200 * pct, 12);
      ctx.strokeStyle = "#fff"; ctx.strokeRect(W - 220, 16, 200, 12);
      ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      ctx.fillText("フックまで", W - 20, 12);
    }
    if (mode === "boss") {
      var pct2 = Math.max(state.boss.hp / BOSS_HP_MAX, 0);
      ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(W - 260, 16, 240, 14);
      ctx.fillStyle = "#ff5c5c"; ctx.fillRect(W - 260, 16, 240 * pct2, 14);
      ctx.strokeStyle = "#fff"; ctx.strokeRect(W - 260, 16, 240, 14);
      ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      ctx.fillText("フック HP", W - 20, 12);
    }

    if (state.messageTimer > 0) {
      ctx.textAlign = "center"; ctx.font = "bold 16px sans-serif";
      ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillText(state.message, W / 2 + 1, 401);
      ctx.fillStyle = "#fff"; ctx.fillText(state.message, W / 2, 400);
    }
  }

  function draw() {
    drawBackground();
    state.items.forEach(drawItem);
    state.obstacles.forEach(drawObstacle);
    state.projectiles.forEach(drawProjectile);
    if (mode === "boss") drawHook(state.boss.enraged, state.boss.flinch);
    drawYamachan(state.player.x, state.player.y, state.player.invincible > 0);
    drawParticles();
    drawHUD();
  }

  function loop(t) {
    var dt = Math.min((t - (state.lastTime || t)) / 1000, 0.033);
    state.lastTime = t;
    if (mode === "playing") updatePlaying(dt);
    else if (mode === "boss") updateBoss(dt);
    else if (mode === "gameover" || mode === "win") updateParticles(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
